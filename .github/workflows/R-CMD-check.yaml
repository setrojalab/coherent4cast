name: R package platform checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        r: [release, devel]
        include:
          - os: ubuntu-latest
            r: oldrel
    runs-on: ${{ matrix.os }}
    env:
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
      _R_CHECK_FORCE_SUGGESTS_: true
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - name: Make gettext headers available to macOS source dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list gettext >/dev/null 2>&1 || brew install gettext
          gettext_prefix="$(brew --prefix gettext)"
          test -r "$gettext_prefix/include/libintl.h"
          echo "CPATH=$gettext_prefix/include${CPATH:+:$CPATH}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$gettext_prefix/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$gettext_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
      - name: Use CRAN source repositories for macOS R-devel
        if: runner.os == 'macOS' && matrix.r == 'devel'
        shell: bash
        run: |
          echo "PKG_PLATFORMS=source" >> "$GITHUB_ENV"
          echo "PKG_USE_BIOCONDUCTOR=FALSE" >> "$GITHUB_ENV"
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          working-directory: package
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          working-directory: package
          args: 'c("--as-cran", "--no-manual")'
          error-on: '"warning"'
          upload-results: always
          artifact-name: check-${{ matrix.os }}-${{ matrix.r }}
